# Weekly dependency update PRs. CI runs the full test-suite on each one.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The trained models in models/*.joblib are pickles tied to these exact versions.
      # Upgrading them requires retraining the models, so never auto-bump them.
      - dependency-name: scikit-learn
      - dependency-name: numpy
      - dependency-name: pandas
      - dependency-name: joblib
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
