{#- Shared <head> SEO/social tags. Expects `seo` from routes/seo.py page_meta(). -#}
<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<meta name="robots" content="{{ seo.robots }}">
<link rel="canonical" href="{{ seo.canonical }}">
<meta name="theme-color" content="#1F3D2B">
<meta name="application-name" content="{{ seo.site_name }}">
{% if seo.google_verification %}<meta name="google-site-verification" content="{{ seo.google_verification }}">
{% endif %}{% if seo.bing_verification %}<meta name="msvalidate.01" content="{{ seo.bing_verification }}">
{% endif %}
<meta property="og:type" content="{{ seo.og_type }}">
<meta property="og:site_name" content="{{ seo.site_name }}">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="AgriSense AI - crop recommendation, yield and cost planning for Andhra Pradesh and Telangana">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.og_image }}">

<link rel="icon" href="{{ url_for('static', filename='img/favicon.svg', v=None) }}" type="image/svg+xml">
<link rel="icon" href="{{ url_for('seo.favicon') }}" sizes="32x32">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png', v=None) }}">
<link rel="manifest" href="{{ url_for('seo.manifest') }}">
{% for block in seo.json_ld %}<script type="application/ld+json">{{ block }}</script>
{% endfor %}
